name: Build Muslim Coran APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compiler APK & AppBundle (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Télécharger les 3 polices arabes OFL (Amiri Quran, Scheherazade New, Lateef)
        run: |
          mkdir -p assets/fonts
          curl -L -sS "https://raw.githubusercontent.com/google/fonts/main/ofl/amiriquran/AmiriQuran-Regular.ttf" -o assets/fonts/AmiriQuran-Regular.ttf
          curl -L -sS "https://raw.githubusercontent.com/google/fonts/main/ofl/scheherazadenew/ScheherazadeNew-Regular.ttf" -o assets/fonts/ScheherazadeNew-Regular.ttf
          curl -L -sS "https://raw.githubusercontent.com/google/fonts/main/ofl/lateef/Lateef-Regular.ttf" -o assets/fonts/Lateef-Regular.ttf

      - name: Régénérer et vérifier assets/db/quran.db
        run: |
          python3 tools/import_quran.py
          python3 tools/import_translations.py
          python3 tools/import_cities.py --fallback-reference
          python3 tools/import_reciters.py
          python3 tools/verify_quran_db.py

      - name: Initialiser le wrapper Gradle Android et récupérer les packages
        run: |
          flutter create . --platforms=android --project-name muslim_coran --org com.muslimcoran
          git checkout -- android/app/src/main/AndroidManifest.xml android/app/build.gradle lib/ test/ pubspec.yaml
          flutter pub get

      - name: Analyse statique et Tests unitaires
        run: |
          flutter analyze
          flutter test

      - name: Compiler les APK par architecture (arm64-v8a, armeabi-v7a, x86_64)
        run: |
          flutter build apk --release --split-per-abi

      - name: Publier les APK en artefacts téléchargeables
        uses: actions/upload-artifact@v4
        with:
          name: muslim-coran-release-apks
          path: build/app/outputs/flutter-apk/*.apk
