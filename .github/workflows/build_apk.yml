name: Build Muslim Coran APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compiler APK & AppBundle (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter (Stable 3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Vérifier l'intégrité de assets/db/quran.db (114 sourates, 6 236 versets)
        run: |
          python3 tools/verify_quran_db.py

      - name: Initialiser le wrapper Gradle Android et appliquer le manifeste sécurisé
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          cp android/app/build.gradle /tmp/app_build.gradle.bak
          cp android/app/proguard-rules.pro /tmp/proguard-rules.pro.bak
          flutter create . --platforms=android --project-name muslim_coran --org com.muslimcoran
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          cp /tmp/app_build.gradle.bak android/app/build.gradle
          cp /tmp/proguard-rules.pro.bak android/app/proguard-rules.pro
          git checkout -- lib/ test/ pubspec.yaml
          flutter pub get

      - name: Analyse statique et Tests unitaires
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Compiler les APK par architecture (arm64-v8a, armeabi-v7a, x86_64)
        run: |
          flutter build apk --release --split-per-abi

      - name: Publier les APK en artefacts téléchargeables
        uses: actions/upload-artifact@v4
        with:
          name: muslim-coran-release-apks
          path: build/app/outputs/flutter-apk/*.apk
