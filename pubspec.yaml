name: muslim_coran
description: Application mobile légère, rapide et 100 % hors ligne pour lire le Coran, calculer les horaires de prière, recevoir l'Adhan et trouver la Qibla.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.0
  path_provider: ^2.1.5
  just_audio: ^0.9.42
  audio_service: ^0.18.16
  adhan: ^2.0.0+1
  geolocator: ^13.0.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_compass: ^0.8.1
  dio: ^5.7.0
  share_plus: ^10.1.3
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/db/
    - assets/audio/
    - assets/fonts/

  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
    - family: Lateef
      fonts:
        - asset: assets/fonts/Lateef-Regular.ttf
