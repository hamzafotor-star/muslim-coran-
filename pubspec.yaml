name: muslim_coran
description: Application mobile légère, rapide et 100 % hors ligne pour lire le Coran, calculer les horaires de prière, recevoir l'Adhan et trouver la Qibla.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  adhan: ^2.0.0+1
  geolocator: ^13.0.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_compass: ^0.8.0
  dio: ^5.7.0
  share_plus: ^10.0.2
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/db/quran.db
    - assets/db/quran_schema.sql
    - assets/audio/adhan_notification.wav
    - assets/fonts/

  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
    - family: Lateef
      fonts:
        - asset: assets/fonts/Lateef-Regular.ttf
